    cpu: "500m"
    memory: "256Mi"
volume:
  name: support-html
  mountPath: /usr/share/nginx/html
configMap:
  suffix: configmap
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  host: support.theakkc.space # your domain
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
