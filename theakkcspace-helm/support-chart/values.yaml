replicaCount: 1
image:
  repository: amitkkc01/akkcsupport
  tag: 11023afa3614d6bf38b7f86922a024b38f875b6c
  pullPolicy: Always
container:
  name: support-app
  port: 80
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
