apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: main-app
  namespace: argocd   # important
  
spec:
  project: default

  source:
    repoURL: https://github.com/akkc01/theakkcspace-deploy-aks-helm-argocd.git
    targetRevision: main
    path: theakkcspace-helm/main-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true